# transcribe-cpp-sys's vendored ggml probes the host CPU via `-mcpu=native`,
# but its build also passes clang an explicit `--target=arm64-apple-macosx`
# (to pin the deployment target). Apple clang rejects that combination:
#   clang: error: unsupported argument 'native' to option '-mcpu='
# GGML_NATIVE=OFF falls back to a portable baseline instead of native-CPU
# probing. transcribe-cpp-sys's build.rs reads this via its documented
# CMAKE_ARGS escape hatch (bindings/rust/sys/build.rs).
[env]
CMAKE_ARGS = "-DGGML_NATIVE=OFF"
