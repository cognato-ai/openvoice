[package]
name = "openvoice"
version = "0.1.0"
description = "OpenVoice — local-first voice typing for macOS"
authors = ["OpenVoice"]
edition = "2021"

[lib]
name = "openvoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification    = "2"
tauri-plugin-dialog           = "2"
tauri-plugin-autostart        = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
macos-accessibility-client = "0.0.1"
# For requesting Microphone access directly from the backend (AVCaptureDevice),
# so the app reliably registers/prompts regardless of window state.
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

# GGUF/GGML multi-architecture ASR engine (the same crate Handy ships) — runs
# every model in resources/catalog.json (Whisper, Parakeet, Canary, Moonshine,
# SenseVoice, GigaAM, Cohere, Voxtral, Qwen3-ASR, Granite-Speech, FunASR,
# MedASR), auto-detecting architecture from the GGUF file header.
transcribe-cpp = { version = "0.1.3", default-features = false, features = ["metal"] }

# Local text LLM for transcript enhancement (V2). Candle is pure-Rust and does
# NOT vendor a ggml C library, so it links cleanly alongside transcribe-cpp-sys's
# statically-linked ggml. (A second ggml-based runner — e.g. llama-cpp-2 — would
# put two ggml copies in one binary and collide on duplicate symbols, the exact
# ODR crash we removed whisper-rs to fix.) Runs Qwen3-0.6B GGUF (quantized) on Metal.
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }
tokenizers = "0.21"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }

# Audio capture
cpal = "0.15"

# WAV file writing
hound = "3.5"

# Parakeet speech recognition bindings (ONNX Runtime based)
parakeet-rs = "0.3.6"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }

# Typing simulation
enigo = "0.2"

# Clipboard
arboard = "3"

# State management
parking_lot = "0.12"

# Logging
log  = "0.4"
env_logger = "0.11"

# HTTP client for model downloads
reqwest = { version = "0.12", features = ["stream", "native-tls"] }
futures-util = "0.3"
