[package]
name = "openvoice"
version = "0.1.0"
description = "OpenVoice — local-first voice typing for macOS"
authors = ["OpenVoice"]
edition = "2021"

[lib]
name = "openvoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification    = "2"
tauri-plugin-dialog           = "2"
tauri-plugin-autostart        = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
macos-accessibility-client = "0.0.1"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }

# Audio capture
cpal = "0.15"

# WAV file writing
hound = "3.5"

# Whisper.cpp bindings for local transcription
whisper-rs = { version = "0.13", features = ["coreml"] }

# Parakeet speech recognition bindings (ONNX Runtime based)
parakeet-rs = "0.3.6"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }

# Typing simulation
enigo = "0.2"

# Clipboard
arboard = "3"

# State management
parking_lot = "0.12"

# Logging
log  = "0.4"
env_logger = "0.11"

# HTTP client for model downloads
reqwest = { version = "0.12", features = ["stream", "native-tls"] }
futures-util = "0.3"
